<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO · Kanban Board</title>
<style>
/* =========================================================================
   1. DESIGN TOKENS — palette, spacing scale, type, radii
   ========================================================================= */
:root {
  /* Corporate blue palette */
  --c-primary-900: #0a2a5e;
  --c-primary-700: #0b3d91;
  --c-primary-600: #1456c4;
  --c-primary-100: #e6eefb;
  --c-primary-50:  #f2f6fd;

  --c-bg:        #f3f6fb;
  --c-surface:   #ffffff;
  --c-surface-2: #f8fafd;
  --c-border:    #d6deeb;
  --c-border-strong: #b7c4d8;
  --c-text:      #1b2433;
  --c-muted:     #5b6779;
  --c-on-primary:#ffffff;

  /* Priority colours (always paired with text labels) */
  --c-critical:     #c62828;
  --c-critical-bg:  #fdecea;
  --c-high:         #e09200;
  --c-high-text:    #8a5300;
  --c-high-bg:      #fff4dc;
  --c-medium:       #1e6fd9;
  --c-medium-bg:    #e5effc;
  --c-low:          #8a94a3;
  --c-low-text:     #4f5968;
  --c-low-bg:       #eef0f3;

  /* Feedback */
  --c-success:    #1d7a46;
  --c-success-bg: #e5f5ec;
  --c-warning:    #8a5300;
  --c-warning-bg: #fff4dc;
  --c-danger:     #b3261e;
  --c-danger-bg:  #fdecea;

  --c-focus: #ffbf47;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(16, 36, 70, .08);
  --shadow-md: 0 4px 14px rgba(16, 36, 70, .12);

  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
}

/* =========================================================================
   2. BASE
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.45;
  color: var(--c-text);
  background: var(--c-bg);
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* Visible focus ring on every interactive element */
:focus-visible {
  outline: 3px solid var(--c-focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* =========================================================================
   3. HEADER — wordmark, summary strip, add-task button, demo note
   ========================================================================= */
.app-header {
  background: linear-gradient(135deg, var(--c-primary-900), var(--c-primary-700));
  color: var(--c-on-primary);
  padding: var(--space-4) var(--space-5);
}
.header-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
}
.wordmark {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-right: auto;
}
.wordmark svg { flex: none; }
.wordmark h1 {
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: .02em;
}
.wordmark .tagline {
  font-size: var(--fs-xs);
  opacity: .85;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.summary {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin: 0;
}
.summary-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 72px;
  padding: var(--space-1) var(--space-3);
  background: rgba(255, 255, 255, .1);
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: var(--radius-md);
}
.summary-item dt {
  font-size: var(--fs-xs);
  opacity: .85;
  white-space: nowrap;
}
.summary-item dd {
  margin: 0;
  font-size: var(--fs-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.summary-item.is-alert { background: rgba(198, 40, 40, .35); border-color: rgba(255, 180, 180, .5); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-weight: 600;
  line-height: 1.2;
}
.btn-primary { background: var(--c-primary-600); color: var(--c-on-primary); }
.btn-primary:hover { background: var(--c-primary-700); }
.btn-primary:disabled { background: var(--c-border-strong); cursor: progress; }
.btn-light { background: var(--c-surface); color: var(--c-primary-700); }
.btn-light:hover { background: var(--c-primary-100); }
.btn-ghost { background: transparent; color: var(--c-primary-700); border-color: var(--c-border); }
.btn-ghost:hover { background: var(--c-primary-50); }

.demo-note {
  margin-top: var(--space-3);
  font-size: var(--fs-xs);
  opacity: .9;
}

/* =========================================================================
   4. LAYOUT — sidebar form + board area
   ========================================================================= */
.layout {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: var(--space-5);
  padding: var(--space-5);
  align-items: start;
}
.layout.panel-collapsed { grid-template-columns: minmax(0, 1fr); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
}

.panel {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

/* =========================================================================
   5. ADD TASK FORM
   ========================================================================= */
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}
.panel-head h2 { font-size: var(--fs-lg); }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 28px; height: 28px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--c-muted);
  font-size: 1.1rem;
  line-height: 1;
}
.icon-btn:hover { background: var(--c-primary-50); color: var(--c-text); }

.field { margin-bottom: var(--space-3); }
.field label {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-sm);
  font-weight: 600;
  margin-bottom: var(--space-1);
}
.field .req { color: var(--c-danger); }
.field .counter { font-weight: 400; color: var(--c-muted); font-variant-numeric: tabular-nums; }
.field input,
.field select,
.field textarea,
.filter input,
.filter select {
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--radius-md);
  background: var(--c-surface);
}
.field textarea { min-height: 76px; resize: vertical; }
.field [aria-invalid="true"] { border-color: var(--c-danger); background: var(--c-danger-bg); }
.field-error {
  min-height: 0;
  margin-top: var(--space-1);
  font-size: var(--fs-xs);
  color: var(--c-danger);
}
.field-error:empty { display: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.form-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
.form-actions .btn-primary { flex: 1; }

/* =========================================================================
   6. FILTER BAR
   ========================================================================= */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  padding: var(--space-3) var(--space-4);
}
.filter { display: flex; flex-direction: column; gap: var(--space-1); min-width: 160px; flex: 1; }
.filter label { font-size: var(--fs-xs); font-weight: 600; color: var(--c-muted); text-transform: uppercase; letter-spacing: .04em; }
.filter-result { font-size: var(--fs-sm); color: var(--c-muted); align-self: center; }

/* =========================================================================
   7. KANBAN BOARD & COLUMNS
   ========================================================================= */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(220px, 1fr));
  gap: var(--space-4);
  overflow-x: auto;
  padding-bottom: var(--space-2);
}
@media (max-width: 767.98px) {
  .board { grid-template-columns: minmax(0, 1fr); overflow-x: visible; }
  .layout { padding: var(--space-4); }
  .app-header { padding: var(--space-4); }
}

.column {
  display: flex;
  flex-direction: column;
  min-height: 240px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-top: 4px solid var(--col-accent, var(--c-primary-600));
  border-radius: var(--radius-lg);
  transition: background-color .12s, box-shadow .12s;
}
.column[data-status="Backlog"]     { --col-accent: #6b7a90; }
.column[data-status="In Progress"] { --col-accent: var(--c-primary-600); }
.column[data-status="Blocked"]     { --col-accent: var(--c-critical); }
.column[data-status="Done"]        { --col-accent: var(--c-success); }

.column.is-drop-target {
  background: var(--c-primary-100);
  box-shadow: inset 0 0 0 2px var(--c-primary-600);
}
.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) 0;
}
.column-header h2 { font-size: var(--fs-md); font-weight: 700; }
.column-header h2:focus { outline: none; }
.column-header h2:focus-visible { outline: 3px solid var(--c-focus); }
.count-badge {
  min-width: 26px;
  padding: 2px var(--space-2);
  border-radius: var(--radius-pill);
  background: var(--c-primary-700);
  color: var(--c-on-primary);
  font-size: var(--fs-xs);
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.column-hint {
  padding: 0 var(--space-3) var(--space-2);
  font-size: var(--fs-xs);
  color: var(--c-muted);
}
.column-body {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3) var(--space-3);
  flex: 1;
}
.column-empty {
  padding: var(--space-4);
  border: 2px dashed var(--c-border);
  border-radius: var(--radius-md);
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--c-muted);
}

/* =========================================================================
   8. TASK CARDS
   ========================================================================= */
.card {
  position: relative;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-left: 5px solid var(--prio, var(--c-low));
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  padding: var(--space-3);
  cursor: grab;
}
.card:hover { box-shadow: var(--shadow-md); }
.card.is-dragging { opacity: .45; cursor: grabbing; }
.card.prio-critical { --prio: var(--c-critical); }
.card.prio-high     { --prio: var(--c-high); }
.card.prio-medium   { --prio: var(--c-medium); }
.card.prio-low      { --prio: var(--c-low); }
.card.is-confirming { border-color: var(--c-danger); border-left-color: var(--c-danger); }

.card-top {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}
.card-id {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--c-muted);
  margin-right: auto;
}
.card-title { font-size: var(--fs-md); font-weight: 650; line-height: 1.3; word-wrap: break-word; }
.card-project { font-size: var(--fs-sm); color: var(--c-primary-700); margin-top: 2px; }
.card-desc {
  margin-top: var(--space-1);
  font-size: var(--fs-sm);
  color: var(--c-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-wrap: break-word;
}
.card-meta {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px var(--space-2);
  margin: var(--space-2) 0 0;
  font-size: var(--fs-sm);
}
.card-meta dt { color: var(--c-muted); }
.card-meta dd { margin: 0; word-break: break-word; }
.card-meta dd.is-overdue { color: var(--c-danger); font-weight: 600; }
.card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-2); }

.pill, .tag, .badge-overdue {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}
.pill-critical { background: var(--c-critical-bg); color: var(--c-critical); }
.pill-high     { background: var(--c-high-bg);     color: var(--c-high-text); }
.pill-medium   { background: var(--c-medium-bg);   color: var(--c-medium); }
.pill-low      { background: var(--c-low-bg);      color: var(--c-low-text); }
.tag { background: var(--c-surface-2); color: var(--c-muted); border: 1px solid var(--c-border); font-weight: 500; }
.badge-overdue { background: var(--c-danger-bg); color: var(--c-danger); border: 1px solid #f5c2bf; }

.card-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid var(--c-border);
}
.move-label { font-size: var(--fs-xs); font-weight: 600; color: var(--c-muted); white-space: nowrap; }
.move-select {
  flex: 1;
  min-width: 0;
  padding: 2px var(--space-2);
  font-size: var(--fs-sm);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--radius-sm);
  background: var(--c-surface);
}
.delete-btn:hover { background: var(--c-danger-bg); color: var(--c-danger); }

.confirm-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding: var(--space-2);
  background: var(--c-danger-bg);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-danger);
}
.confirm-row span { margin-right: auto; }
.btn-sm { padding: 2px var(--space-3); font-size: var(--fs-sm); border-radius: var(--radius-sm); }
.btn-danger { background: var(--c-danger); color: var(--c-on-primary); border: 1px solid var(--c-danger); }
.btn-danger:hover { background: #8f1d17; }
.btn-plain { background: var(--c-surface); border: 1px solid var(--c-border-strong); color: var(--c-text); }

/* =========================================================================
   9. TOASTS
   ========================================================================= */
.toast-region {
  position: fixed;
  right: var(--space-4);
  bottom: var(--space-4);
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  width: min(380px, calc(100vw - 2 * var(--space-4)));
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: 1px solid var(--c-border);
  border-left: 5px solid var(--toast-accent, var(--c-primary-600));
  background: var(--c-surface);
  box-shadow: var(--shadow-md);
  font-size: var(--fs-sm);
  animation: toast-in .18s ease-out;
}
.toast-success { --toast-accent: var(--c-success); }
.toast-warning { --toast-accent: var(--c-high); background: var(--c-warning-bg); }
.toast-info    { --toast-accent: var(--c-primary-600); }
.toast-msg { flex: 1; }
.toast-icon { font-weight: 700; color: var(--toast-accent); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
  .column { transition: none; }
}
</style>
</head>
<body>

<!-- =========================================================================
     HEADER: neutral text wordmark, live summary strip, add-task trigger
     ========================================================================= -->
<header class="app-header">
  <div class="header-row">
    <div class="wordmark">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
        <rect x="7" y="8" width="5" height="18" rx="1.5" fill="#fff"/>
        <rect x="14.5" y="8" width="5" height="12" rx="1.5" fill="#fff" fill-opacity=".8"/>
        <rect x="22" y="8" width="5" height="8" rx="1.5" fill="#fff" fill-opacity=".6"/>
      </svg>
      <div>
        <h1>IT PMO</h1>
        <p class="tagline">Project Kanban · Internal training demo</p>
      </div>
    </div>

    <dl class="summary" aria-label="Board summary">
      <div class="summary-item"><dt>Total</dt><dd id="sum-total">0</dd></div>
      <div class="summary-item"><dt>Backlog</dt><dd id="sum-backlog">0</dd></div>
      <div class="summary-item"><dt>In Progress</dt><dd id="sum-in-progress">0</dd></div>
      <div class="summary-item"><dt>Blocked</dt><dd id="sum-blocked">0</dd></div>
      <div class="summary-item"><dt>Done</dt><dd id="sum-done">0</dd></div>
      <div class="summary-item" id="sum-overdue-item"><dt>⚠ Overdue</dt><dd id="sum-overdue">0</dd></div>
    </dl>

    <button type="button" class="btn btn-light" id="open-panel-btn" aria-controls="task-panel" aria-expanded="true">
      <span aria-hidden="true">+</span> Add Task
    </button>
  </div>
  <p class="demo-note">
    <span aria-hidden="true">ⓘ</span>
    Demo mode: the board is held in memory only. Refreshing the page resets it to the sample tasks.
  </p>
</header>

<main class="layout" id="layout">

  <!-- =======================================================================
       ADD TASK PANEL (sidebar)
       ======================================================================= -->
  <section class="panel" id="task-panel" aria-labelledby="task-panel-title">
    <div class="panel-head">
      <h2 id="task-panel-title">Add Task</h2>
      <button type="button" class="icon-btn" id="close-panel-btn" aria-label="Hide Add Task panel">×</button>
    </div>

    <form id="task-form" novalidate>
      <div class="field">
        <label for="f-title">
          <span>Task Title <span class="req" aria-hidden="true">*</span></span>
          <span class="counter" id="f-title-count" aria-hidden="true">0/80</span>
        </label>
        <input id="f-title" name="title" type="text" maxlength="80" required autocomplete="off" aria-describedby="err-title">
        <p class="field-error" id="err-title"></p>
      </div>

      <div class="field">
        <label for="f-description">
          <span>Description</span>
          <span class="counter" id="f-description-count" aria-hidden="true">0/500</span>
        </label>
        <textarea id="f-description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
        <p class="field-error" id="err-description"></p>
      </div>

      <div class="field">
        <label for="f-project"><span>Project / Workstream <span class="req" aria-hidden="true">*</span></span></label>
        <select id="f-project" name="project" required aria-describedby="err-project"></select>
        <p class="field-error" id="err-project"></p>
      </div>

      <div class="field">
        <label for="f-category"><span>Category <span class="req" aria-hidden="true">*</span></span></label>
        <select id="f-category" name="category" required aria-describedby="err-category"></select>
        <p class="field-error" id="err-category"></p>
      </div>

      <div class="field">
        <label for="f-assignee"><span>Assignee <span class="req" aria-hidden="true">*</span></span></label>
        <input id="f-assignee" name="assignee" type="text" maxlength="60" required autocomplete="off" aria-describedby="err-assignee">
        <p class="field-error" id="err-assignee"></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-priority"><span>Priority</span></label>
          <select id="f-priority" name="priority" aria-describedby="err-priority"></select>
          <p class="field-error" id="err-priority"></p>
        </div>
        <div class="field">
          <label for="f-status"><span>Status</span></label>
          <select id="f-status" name="status" aria-describedby="err-status"></select>
          <p class="field-error" id="err-status"></p>
        </div>
      </div>

      <div class="field">
        <label for="f-dueDate"><span>Due Date <span class="req" aria-hidden="true">*</span></span></label>
        <input id="f-dueDate" name="dueDate" type="date" required aria-describedby="err-dueDate">
        <p class="field-error" id="err-dueDate"></p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Task</button>
        <button type="reset" class="btn btn-ghost">Clear</button>
      </div>
    </form>
  </section>

  <!-- =======================================================================
       BOARD AREA: filter bar + four Kanban columns
       ======================================================================= -->
  <section aria-labelledby="board-title">
    <h2 id="board-title" class="visually-hidden">Kanban board</h2>

    <form class="panel filter-bar" id="filter-form" role="search" aria-label="Filter tasks">
      <div class="filter">
        <label for="filter-project">Project</label>
        <select id="filter-project" name="project"></select>
      </div>
      <div class="filter">
        <label for="filter-assignee">Assignee contains</label>
        <input id="filter-assignee" name="assignee" type="search" placeholder="e.g. Tan" autocomplete="off">
      </div>
      <div class="filter">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority" name="priority"></select>
      </div>
      <button type="reset" class="btn btn-ghost">Clear filters</button>
      <p class="filter-result" id="filter-result" aria-live="polite"></p>
    </form>

    <!-- Columns are rendered from state by renderBoard() -->
    <div class="board" id="board"></div>
  </section>
</main>

<!-- Toast notifications (announced politely to screen readers) -->
<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

<!--
  =============================================================================
  FORMSUBMIT CONFIG — see FORMSUBMIT_ENDPOINT at the top of the script below.
  Replace YOUR_EMAIL@example.com with the inbox that should receive new-task
  notifications.

  ONE-TIME ACTIVATION: FormSubmit requires the address to be activated. The
  very first submission does NOT deliver; instead FormSubmit sends a
  confirmation email to that address. Click the activation link in it, and
  only submissions made after that will be delivered.

  Note: FormSubmit may refuse requests from pages opened as local files
  (file://). For real email delivery, serve this file from any web server or
  static host. The board itself works either way.
  =============================================================================
-->
<script>
"use strict";

/* ===========================================================================
   1. CONFIG — change the email address here, in one place only.
   ========================================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const FORMSUBMIT_TIMEOUT_MS = 15000;
const TASK_ID_PREFIX = "UOB-ITPM-";

/* ===========================================================================
   2. REFERENCE DATA
   ========================================================================= */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on a dependency, vendor or approval",
  "Done": "Completed / closed",
};
const PROJECTS = [
  "Core Banking Upgrade",
  "Digital Channels",
  "Cybersecurity Uplift",
  "Data & Analytics",
  "Infrastructure & Cloud",
  "Vendor Management",
];
const CATEGORIES = [
  "Application Development",
  "Infrastructure",
  "Cybersecurity",
  "Data",
  "Compliance",
  "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PRIORITY_RANK = { Critical: 0, High: 1, Medium: 2, Low: 3 };
const LIMITS = { title: 80, description: 500, assignee: 60 };

/* ===========================================================================
   3. STATE — single source of truth. In memory only; never persisted.
   ========================================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  ui: {
    pendingDeleteId: null, // card currently showing the inline "Delete? Yes / No"
    focusSelector: null,   // element to re-focus after the next render
    submitting: false,
  },
};

/* ===========================================================================
   4. HELPERS — escaping, dates, IDs
   ========================================================================= */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function slugify(value) {
  return String(value).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function pad(n, width = 2) {
  return String(n).padStart(width, "0");
}

/** Local calendar date as YYYY-MM-DD (avoids UTC off-by-one). */
function toISODate(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function todayISO() {
  return toISODate(new Date());
}

function addDaysISO(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return toISODate(d);
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function generateTaskId() {
  return TASK_ID_PREFIX + pad(state.nextId++, 4);
}

function findTask(id) {
  return state.tasks.find((t) => t.id === id);
}

function cardSelector(id, inner = "") {
  return `.card[data-id="${CSS.escape(id)}"] ${inner}`.trim();
}

/* ===========================================================================
   5. SEED DATA — 8 demo tasks; due dates relative to today so the
      overdue logic is always demonstrable.
   ========================================================================= */
function seedTasks() {
  const seeds = [
    { title: "Migrate FX pricing service to AWS", description: "Lift-and-shift of the FX rate engine to the AWS landing zone with blue/green cutover.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Daniel Tan", priority: "High", dueDate: addDaysISO(12), status: "In Progress" },
    { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Apply vendor hotfix across the teller VDI pool. Awaiting CAB emergency change approval.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Aisyah Rahman", priority: "Critical", dueDate: addDaysISO(-2), status: "Blocked" },
    { title: "UAT sign-off for mobile onboarding release 4.2", description: "Collect business sign-off on eKYC and account-opening journeys.", project: "Digital Channels", category: "Application Development", assignee: "Priya Raman", priority: "High", dueDate: addDaysISO(-1), status: "In Progress" },
    { title: "GL interface regression test pack", description: "Automate the general-ledger interface regression suite ahead of the core upgrade dress rehearsal.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Marcus Lim", priority: "Medium", dueDate: addDaysISO(21), status: "Backlog" },
    { title: "Technology risk control self-assessment evidence", description: "Compile annual control evidence for access management and change controls.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Wei Ling Ong", priority: "High", dueDate: addDaysISO(30), status: "Backlog" },
    { title: "Renew payments gateway vendor support contract", description: "Contract redlines with procurement; pending legal review of the SLA schedule.", project: "Vendor Management", category: "Vendor", assignee: "Kevin Ng", priority: "High", dueDate: addDaysISO(5), status: "Blocked" },
    { title: "Build customer 360 data mart for retail risk", description: "", project: "Data & Analytics", category: "Data", assignee: "Arjun Mehta", priority: "Low", dueDate: addDaysISO(45), status: "Backlog" },
    { title: "Decommission legacy batch scheduler servers", description: "All jobs migrated to the new orchestrator; servers wiped and returned.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Siti Nurhaliza", priority: "Medium", dueDate: addDaysISO(-10), status: "Done" },
  ];
  state.tasks = seeds.map((s) => ({ id: generateTaskId(), ...s }));
}

/* ===========================================================================
   6. FILTERING — pure client-side over the in-memory array
   ========================================================================= */
function isFiltering() {
  const f = state.filters;
  return Boolean(f.project || f.assignee || f.priority);
}

function matchesFilters(task) {
  const f = state.filters;
  if (f.project && task.project !== f.project) return false;
  if (f.priority && task.priority !== f.priority) return false;
  if (f.assignee && !task.assignee.toLowerCase().includes(f.assignee.toLowerCase())) return false;
  return true;
}

/** Read the filter controls into state, then re-render. */
function applyFilters() {
  const form = document.getElementById("filter-form");
  state.filters = {
    project: form.elements.project.value,
    assignee: form.elements.assignee.value.trim(),
    priority: form.elements.priority.value,
  };
  renderBoard();
}

/* ===========================================================================
   7. RENDERING — everything on the board is derived from state
   ========================================================================= */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = slugify(task.priority);
  const overdue = isOverdue(task);
  const confirming = state.ui.pendingDeleteId === task.id;
  const titleId = `title-${slugify(task.id)}`;

  const moveOptions = STATUSES
    .filter((s) => s !== task.status)
    .map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`)
    .join("");

  const actions = confirming
    ? `<div class="confirm-row" role="group" aria-label="Confirm delete ${id}">
         <span>Delete?</span>
         <button type="button" class="btn btn-sm btn-danger" data-action="confirm-yes" data-id="${id}">Yes</button>
         <button type="button" class="btn btn-sm btn-plain" data-action="confirm-no" data-id="${id}">No</button>
       </div>`
    : `<div class="card-actions">
         <label class="move-label" for="move-${slugify(task.id)}">Move ▸</label>
         <select class="move-select" id="move-${slugify(task.id)}" data-id="${id}" aria-label="Move ${id} to another column">
           <option value="" selected>Choose column…</option>
           ${moveOptions}
         </select>
       </div>`;

  return `
    <article class="card prio-${prio}${confirming ? " is-confirming" : ""}" draggable="true" data-id="${id}" aria-labelledby="${titleId}">
      <div class="card-top">
        <span class="card-id">${id}</span>
        ${overdue ? `<span class="badge-overdue"><span aria-hidden="true">⚠</span> Overdue</span>` : ""}
        <button type="button" class="icon-btn delete-btn" data-action="delete" data-id="${id}" aria-label="Delete task ${id}">×</button>
      </div>
      <h3 class="card-title" id="${titleId}">${escapeHtml(task.title)}</h3>
      <p class="card-project">${escapeHtml(task.project)}</p>
      ${task.description ? `<p class="card-desc" title="${escapeHtml(task.description)}">${escapeHtml(task.description)}</p>` : ""}
      <dl class="card-meta">
        <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
        <dt>Due</dt><dd class="${overdue ? "is-overdue" : ""}"><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
      </dl>
      <div class="card-tags">
        <span class="pill pill-${prio}">Priority: ${escapeHtml(task.priority)}</span>
        <span class="tag">${escapeHtml(task.category)}</span>
      </div>
      ${actions}
    </article>`;
}

function sortTasks(a, b) {
  return (PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]) || a.dueDate.localeCompare(b.dueDate);
}

function renderBoard() {
  const board = document.getElementById("board");
  const filtering = isFiltering();
  const visible = state.tasks.filter(matchesFilters);

  board.innerHTML = STATUSES.map((status) => {
    const slug = slugify(status);
    const total = state.tasks.filter((t) => t.status === status).length;
    const cards = visible.filter((t) => t.status === status).sort(sortTasks);
    const countText = filtering ? `${cards.length}/${total}` : String(total);
    const countLabel = filtering ? `${cards.length} of ${total} tasks shown` : `${total} tasks`;
    const body = cards.length
      ? cards.map(renderCard).join("")
      : `<p class="column-empty">${filtering && total ? "No tasks match the filters" : "Drop tasks here"}</p>`;

    return `
      <section class="column" data-status="${escapeHtml(status)}" aria-labelledby="col-${slug}">
        <header class="column-header">
          <h2 id="col-${slug}" tabindex="-1">${escapeHtml(status)}</h2>
          <span class="count-badge" aria-label="${escapeHtml(countLabel)}">${escapeHtml(countText)}</span>
        </header>
        <p class="column-hint">${escapeHtml(STATUS_HINTS[status])}</p>
        <div class="column-body">${body}</div>
      </section>`;
  }).join("");

  document.getElementById("filter-result").textContent = filtering
    ? `Showing ${visible.length} of ${state.tasks.length} tasks`
    : "";

  renderSummary();
  restoreFocus();
}

function renderSummary() {
  const count = (status) => state.tasks.filter((t) => t.status === status).length;
  const overdue = state.tasks.filter(isOverdue).length;
  document.getElementById("sum-total").textContent = state.tasks.length;
  STATUSES.forEach((s) => {
    document.getElementById(`sum-${slugify(s)}`).textContent = count(s);
  });
  document.getElementById("sum-overdue").textContent = overdue;
  document.getElementById("sum-overdue-item").classList.toggle("is-alert", overdue > 0);
}

/** After a re-render, move keyboard focus to a sensible element. */
function restoreFocus() {
  const selector = state.ui.focusSelector;
  state.ui.focusSelector = null;
  if (!selector) return;
  const el = document.querySelector(selector);
  if (el) el.focus();
}

/* ===========================================================================
   8. TASK OPERATIONS — mutate state, then re-render
   ========================================================================= */
function addTask(data) {
  const task = { id: generateTaskId(), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus, { keepFocus = false } = {}) {
  const task = findTask(id);
  if (!task || !STATUSES.includes(newStatus) || task.status === newStatus) return;
  task.status = newStatus;
  if (keepFocus) state.ui.focusSelector = cardSelector(id, ".move-select");
  renderBoard();
  showToast(`${task.id} moved to ${newStatus}.`, "info");
}

function deleteTask(id) {
  const task = findTask(id);
  if (!task) return;
  state.tasks = state.tasks.filter((t) => t.id !== id);
  state.ui.pendingDeleteId = null;
  state.ui.focusSelector = `#col-${slugify(task.status)}`;
  renderBoard();
  showToast(`${task.id} deleted.`, "info");
}

function requestDelete(id) {
  state.ui.pendingDeleteId = id;
  state.ui.focusSelector = cardSelector(id, '[data-action="confirm-no"]');
  renderBoard();
}

function cancelDelete() {
  const id = state.ui.pendingDeleteId;
  if (!id) return;
  state.ui.pendingDeleteId = null;
  state.ui.focusSelector = cardSelector(id, '[data-action="delete"]');
  renderBoard();
}

/* ===========================================================================
   9. TOASTS — transient, non-blocking messages
   ========================================================================= */
const TOAST_ICONS = { success: "✓", warning: "⚠", info: "ⓘ" };

function showToast(message, type = "info") {
  const region = document.getElementById("toast-region");
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;

  const icon = document.createElement("span");
  icon.className = "toast-icon";
  icon.setAttribute("aria-hidden", "true");
  icon.textContent = TOAST_ICONS[type] || TOAST_ICONS.info;

  const msg = document.createElement("span");
  msg.className = "toast-msg";
  msg.textContent = message;

  const close = document.createElement("button");
  close.type = "button";
  close.className = "icon-btn";
  close.setAttribute("aria-label", "Dismiss notification");
  close.textContent = "×";
  close.addEventListener("click", () => toast.remove());

  toast.append(icon, msg, close);
  region.append(toast);
  setTimeout(() => toast.remove(), type === "warning" ? 8000 : 4000);
}

/* ===========================================================================
   10. FORMSUBMIT — email notification for new tasks (AJAX, no navigation)
   ========================================================================= */
async function notifyNewTask(task) {
  if (FORMSUBMIT_ENDPOINT.includes("YOUR_EMAIL@example.com")) {
    // Not configured yet: don't send anything to a placeholder address.
    throw new Error("FormSubmit endpoint not configured");
  }

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), FORMSUBMIT_TIMEOUT_MS);
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    const json = await res.json();
    // FormSubmit can answer 200 with { success: "false", message: "..." }
    if (json && String(json.success) === "false") {
      throw new Error(`FormSubmit rejected: ${json.message || "unknown reason"}`);
    }
    return json;
  } finally {
    clearTimeout(timer);
  }
}

/* ===========================================================================
   11. ADD TASK FORM — validation, submit, reset
   ========================================================================= */
const FORM_FIELDS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function validateTaskForm(form) {
  const val = (name) => form.elements[name].value.trim();
  const data = {
    title: val("title"),
    description: val("description"),
    project: val("project"),
    category: val("category"),
    assignee: val("assignee"),
    priority: val("priority"),
    dueDate: val("dueDate"),
    status: val("status"),
  };
  const errors = {};

  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > LIMITS.title) errors.title = `Keep the title to ${LIMITS.title} characters or fewer.`;

  if (data.description.length > LIMITS.description) errors.description = `Keep the description to ${LIMITS.description} characters or fewer.`;

  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project or workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";

  if (!data.assignee) errors.assignee = "Assignee is required.";
  else if (data.assignee.length > LIMITS.assignee) errors.assignee = `Keep the assignee to ${LIMITS.assignee} characters or fewer.`;

  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";
  if (!STATUSES.includes(data.status)) errors.status = "Choose a status.";

  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";

  return { valid: Object.keys(errors).length === 0, data, errors };
}

function showFieldErrors(form, errors) {
  FORM_FIELDS.forEach((name) => {
    const input = form.elements[name];
    const message = errors[name] || "";
    document.getElementById(`err-${name}`).textContent = message;
    if (message) input.setAttribute("aria-invalid", "true");
    else input.removeAttribute("aria-invalid");
  });
}

function updateCounters(form) {
  document.getElementById("f-title-count").textContent = `${form.elements.title.value.length}/${LIMITS.title}`;
  document.getElementById("f-description-count").textContent = `${form.elements.description.value.length}/${LIMITS.description}`;
}

function resetTaskForm(form) {
  form.reset();
  showFieldErrors(form, {});
  updateCounters(form);
}

function setSubmitting(isSubmitting) {
  const btn = document.getElementById("submit-btn");
  state.ui.submitting = isSubmitting;
  btn.disabled = isSubmitting;
  btn.textContent = isSubmitting ? "Sending…" : "Add Task";
}

async function handleTaskSubmit(event) {
  event.preventDefault();
  const form = event.currentTarget;
  if (state.ui.submitting) return;

  const { valid, data, errors } = validateTaskForm(form);
  showFieldErrors(form, errors);
  if (!valid) {
    const first = FORM_FIELDS.find((name) => errors[name]);
    form.elements[first].focus();
    return;
  }

  // Optimistic UI: card appears immediately; email goes out in parallel.
  const task = addTask(data);
  resetTaskForm(form);
  form.elements.title.focus();
  showToast(`${task.id} added to ${task.status}.`, "success");

  setSubmitting(true);
  try {
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}.`, "info");
  } catch (err) {
    console.warn("[IT PMO] notification failed:", err);
    showToast("Card added locally — email notification failed", "warning");
  } finally {
    setSubmitting(false);
  }
}

/* ===========================================================================
   12. EVENT BINDING — delegated board events, drag and drop, filters, form
   ========================================================================= */
function highlightColumn(column) {
  document.querySelectorAll(".column.is-drop-target").forEach((c) => {
    if (c !== column) c.classList.remove("is-drop-target");
  });
  if (column) column.classList.add("is-drop-target");
}

function bindDragAndDrop(board) {
  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("is-dragging");
  });

  board.addEventListener("dragover", (e) => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault(); // allow drop
    e.dataTransfer.dropEffect = "move";
    highlightColumn(column);
  });

  board.addEventListener("dragleave", (e) => {
    if (!e.relatedTarget || !board.contains(e.relatedTarget)) highlightColumn(null);
  });

  board.addEventListener("drop", (e) => {
    const column = e.target.closest(".column");
    highlightColumn(null);
    if (!column) return;
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveTask(id, column.dataset.status);
  });

  board.addEventListener("dragend", (e) => {
    highlightColumn(null);
    const card = e.target.closest(".card");
    if (card) card.classList.remove("is-dragging");
  });
}

function bindBoardEvents(board) {
  board.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete") requestDelete(id);
    else if (btn.dataset.action === "confirm-yes") deleteTask(id);
    else if (btn.dataset.action === "confirm-no") cancelDelete();
  });

  board.addEventListener("change", (e) => {
    const select = e.target.closest(".move-select");
    if (select && select.value) moveTask(select.dataset.id, select.value, { keepFocus: true });
  });

  board.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.ui.pendingDeleteId) cancelDelete();
  });
}

function bindFilterEvents() {
  const form = document.getElementById("filter-form");
  form.addEventListener("input", applyFilters);
  form.addEventListener("change", applyFilters);
  form.addEventListener("submit", (e) => e.preventDefault());
  form.addEventListener("reset", () => setTimeout(applyFilters, 0)); // after values reset
}

function bindFormEvents() {
  const form = document.getElementById("task-form");
  form.addEventListener("submit", handleTaskSubmit);
  form.addEventListener("input", (e) => {
    updateCounters(form);
    // Clear a field's error as soon as the user edits it
    const name = e.target.name;
    if (name && e.target.getAttribute("aria-invalid") === "true") {
      e.target.removeAttribute("aria-invalid");
      document.getElementById(`err-${name}`).textContent = "";
    }
  });
  form.addEventListener("reset", () => setTimeout(() => resetTaskForm(form), 0));
}

function bindPanelToggle() {
  const layout = document.getElementById("layout");
  const panel = document.getElementById("task-panel");
  const openBtn = document.getElementById("open-panel-btn");
  const closeBtn = document.getElementById("close-panel-btn");

  openBtn.addEventListener("click", () => {
    panel.hidden = false;
    layout.classList.remove("panel-collapsed");
    openBtn.setAttribute("aria-expanded", "true");
    panel.scrollIntoView({ block: "start", behavior: "smooth" });
    document.getElementById("f-title").focus({ preventScroll: true });
  });

  closeBtn.addEventListener("click", () => {
    panel.hidden = true;
    layout.classList.add("panel-collapsed");
    openBtn.setAttribute("aria-expanded", "false");
    openBtn.focus();
  });
}

/* ===========================================================================
   13. INIT
   ========================================================================= */
function fillSelect(select, values, { placeholder, selected } = {}) {
  const opts = values.map((v) =>
    `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`);
  if (placeholder !== undefined) opts.unshift(`<option value="">${escapeHtml(placeholder)}</option>`);
  select.innerHTML = opts.join("");
}

function init() {
  // Form selects (defaultSelected so form.reset() restores Medium / Backlog)
  fillSelect(document.getElementById("f-project"), PROJECTS, { placeholder: "Select a project…" });
  fillSelect(document.getElementById("f-category"), CATEGORIES, { placeholder: "Select a category…" });
  fillSelect(document.getElementById("f-priority"), PRIORITIES, { selected: "Medium" });
  fillSelect(document.getElementById("f-status"), STATUSES, { selected: "Backlog" });
  document.getElementById("f-dueDate").min = todayISO();

  // Filter selects
  fillSelect(document.getElementById("filter-project"), PROJECTS, { placeholder: "All projects" });
  fillSelect(document.getElementById("filter-priority"), PRIORITIES, { placeholder: "All priorities" });

  const board = document.getElementById("board");
  bindDragAndDrop(board);
  bindBoardEvents(board);
  bindFilterEvents();
  bindFormEvents();
  bindPanelToggle();

  seedTasks();
  renderBoard();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
