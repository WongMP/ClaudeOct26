<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Kanban (Demo)</title>
<style>
/* ===== Design tokens: palette + spacing scale ===== */
:root {
  --blue-900: #0b2545;
  --blue-700: #13438a;
  --blue-600: #1a56b0;
  --blue-100: #dce8f8;
  --blue-50: #eef4fc;
  --ink: #16202e;
  --ink-soft: #52627a;
  --line: #cfd9e8;
  --surface: #ffffff;
  --bg: #f1f5fa;
  --red: #c62828;
  --red-bg: #fdecec;
  --amber: #d98400;
  --grey: #8794a8;
  --green: #1b7a43;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --radius: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ===== Base ===== */
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue-600); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Header + summary strip ===== */
.app-header { background: var(--blue-900); color: #fff; padding: var(--s-3) var(--s-5); display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: center; justify-content: space-between; }
.wordmark { font-size: 20px; font-weight: 700; letter-spacing: .5px; margin: 0; }
.wordmark span { font-weight: 400; opacity: .8; font-size: 14px; margin-left: var(--s-2); }
.summary { display: flex; flex-wrap: wrap; gap: var(--s-2); list-style: none; margin: 0; padding: 0; }
.summary li { background: rgba(255,255,255,.12); border-radius: var(--radius); padding: var(--s-1) var(--s-3); font-size: 13px; }
.summary strong { font-size: 16px; margin-right: var(--s-1); }
.summary .is-overdue { background: var(--red); }
.btn { border: 1px solid var(--blue-600); background: var(--blue-600); color: #fff; padding: var(--s-2) var(--s-4); border-radius: var(--radius); cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--blue-700); }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--blue-700); }
.btn-ghost:hover { background: var(--blue-50); }
.app-header .btn { background: #fff; color: var(--blue-900); border-color: #fff; }
.app-header .btn:hover { background: var(--blue-100); }

/* ===== Filter bar ===== */
.filters { display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: flex-end; padding: var(--s-3) var(--s-5); background: var(--surface); border-bottom: 1px solid var(--line); }
.filters label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: var(--s-1); }
.filters input, .filters select { min-width: 170px; }
.note { margin-left: auto; font-size: 12px; color: var(--ink-soft); }

/* ===== Board + columns ===== */
main { padding: var(--s-4) var(--s-5) var(--s-6); }
.board { display: flex; gap: var(--s-4); align-items: flex-start; }
.column { flex: 1 1 0; min-width: 0; background: var(--blue-50); border: 2px solid transparent; border-radius: var(--radius); padding: var(--s-3); min-height: 200px; }
.column.drop-target { border-color: var(--blue-600); background: var(--blue-100); border-style: dashed; }
.column-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s-3); }
.column-head h2 { font-size: 15px; margin: 0; color: var(--blue-900); }
.column-head p { margin: 0; font-size: 11px; color: var(--ink-soft); }
.count { background: var(--blue-700); color: #fff; border-radius: 999px; min-width: 24px; text-align: center; padding: 1px var(--s-2); font-size: 12px; font-weight: 700; }
.cards { display: flex; flex-direction: column; gap: var(--s-3); min-height: 60px; }
.empty { color: var(--ink-soft); font-size: 12px; text-align: center; padding: var(--s-4); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ===== Cards ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--grey); border-radius: var(--radius); padding: var(--s-3); cursor: grab; box-shadow: 0 1px 2px rgba(11,37,69,.08); }
.card.dragging { opacity: .45; }
.card[data-priority="Critical"] { border-left-color: var(--red); }
.card[data-priority="High"] { border-left-color: var(--amber); }
.card[data-priority="Medium"] { border-left-color: var(--blue-600); }
.card[data-priority="Low"] { border-left-color: var(--grey); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); }
.task-id { font-size: 11px; font-weight: 700; color: var(--ink-soft); font-family: ui-monospace, Menlo, Consolas, monospace; }
.card h3 { font-size: 14px; margin: var(--s-1) 0; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--ink-soft); margin: 2px 0; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: var(--s-1); margin: var(--s-2) 0; }
.pill, .tag, .overdue { font-size: 11px; padding: 1px var(--s-2); border-radius: 999px; font-weight: 600; border: 1px solid; }
.pill[data-p="Critical"] { color: var(--red); border-color: var(--red); background: var(--red-bg); }
.pill[data-p="High"] { color: #8a5400; border-color: var(--amber); background: #fff4e0; }
.pill[data-p="Medium"] { color: var(--blue-700); border-color: var(--blue-600); background: var(--blue-50); }
.pill[data-p="Low"] { color: var(--ink-soft); border-color: var(--grey); background: #eef0f4; }
.tag { color: var(--ink-soft); border-color: var(--line); background: var(--surface); border-radius: var(--radius); }
.overdue { color: var(--red); border-color: var(--red); background: var(--red-bg); }
.card-actions { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; margin-top: var(--s-2); }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 2px var(--s-2); cursor: pointer; font-size: 12px; }
.mini:hover { background: var(--blue-50); }
.mini.danger { color: var(--red); border-color: var(--red); }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-soft); border-radius: var(--radius); padding: 0 var(--s-1); }
.icon-btn:hover { color: var(--red); background: var(--red-bg); }
.confirm { background: var(--red-bg); border-radius: var(--radius); padding: var(--s-2); font-size: 12px; display: flex; gap: var(--s-2); align-items: center; margin-top: var(--s-2); flex-wrap: wrap; }
.move-menu { display: flex; gap: var(--s-1); flex-wrap: wrap; margin-top: var(--s-2); }

/* ===== Modal + form ===== */
.modal-backdrop { position: fixed; inset: 0; background: rgba(11,37,69,.55); display: none; align-items: flex-start; justify-content: center; padding: var(--s-5) var(--s-3); overflow-y: auto; z-index: 10; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 560px; padding: var(--s-5); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s-3); }
.modal-head h2 { margin: 0; color: var(--blue-900); }
.field { margin-bottom: var(--s-3); }
.field label { display: block; font-weight: 600; margin-bottom: var(--s-1); }
.field input, .field select, .field textarea, .filters input, .filters select { width: 100%; padding: var(--s-2); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.field textarea { min-height: 80px; resize: vertical; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); }
.error { color: var(--red); font-size: 12px; margin: var(--s-1) 0 0; min-height: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.form-actions { display: flex; justify-content: flex-end; gap: var(--s-2); margin-top: var(--s-4); }

/* ===== Toasts ===== */
.toasts { position: fixed; bottom: var(--s-4); right: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); z-index: 20; max-width: 90vw; }
.toast { background: var(--green); color: #fff; padding: var(--s-3) var(--s-4); border-radius: var(--radius); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.toast.warn { background: var(--amber); color: #1d1300; }

/* ===== Responsive: stack columns below 768px ===== */
@media (max-width: 767px) {
  .board { flex-direction: column; align-items: stretch; }
  .column { flex: none; width: 100%; }
  .grid-2 { grid-template-columns: 1fr; }
  main, .filters, .app-header { padding-left: var(--s-3); padding-right: var(--s-3); }
  .note { margin-left: 0; }
}
</style>
</head>
<body>

<!-- ===== Header: wordmark, live summary strip, add button ===== -->
<header class="app-header">
  <h1 class="wordmark">IT PMO<span>Project Kanban · Demo</span></h1>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <button type="button" class="btn" id="openAdd">+ Add Task</button>
</header>

<!-- ===== Filter bar ===== -->
<section class="filters" aria-label="Filters">
  <div>
    <label for="fProject">Project</label>
    <select id="fProject"></select>
  </div>
  <div>
    <label for="fAssignee">Assignee contains</label>
    <input type="text" id="fAssignee" placeholder="e.g. Tan">
  </div>
  <div>
    <label for="fPriority">Priority</label>
    <select id="fPriority"></select>
  </div>
  <button type="button" class="btn btn-ghost" id="clearFilters">Clear filters</button>
  <p class="note">Demo data lives in memory only — refreshing the page resets the board.</p>
</section>

<!-- ===== Board ===== -->
<main>
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- ===== Add Task modal ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Add Task</h2>
      <button type="button" class="icon-btn" id="closeAdd" aria-label="Close add task dialog">×</button>
    </div>
    <form id="taskForm" novalidate>
      <div class="field" data-field="title">
        <label for="title">Task Title *</label>
        <input type="text" id="title" name="title" maxlength="80" aria-describedby="err-title">
        <p class="error" id="err-title"></p>
      </div>
      <div class="field" data-field="description">
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
        <p class="error" id="err-description"></p>
      </div>
      <div class="grid-2">
        <div class="field" data-field="project">
          <label for="project">Project / Workstream</label>
          <select id="project" name="project"></select>
        </div>
        <div class="field" data-field="category">
          <label for="category">Category</label>
          <select id="category" name="category"></select>
        </div>
      </div>
      <div class="field" data-field="assignee">
        <label for="assignee">Assignee *</label>
        <input type="text" id="assignee" name="assignee" aria-describedby="err-assignee">
        <p class="error" id="err-assignee"></p>
      </div>
      <div class="grid-2">
        <div class="field" data-field="priority">
          <label for="priority">Priority</label>
          <select id="priority" name="priority"></select>
        </div>
        <div class="field" data-field="status">
          <label for="status">Status</label>
          <select id="status" name="status"></select>
        </div>
      </div>
      <div class="field" data-field="dueDate">
        <label for="dueDate">Due Date *</label>
        <input type="date" id="dueDate" name="dueDate" aria-describedby="err-dueDate">
        <p class="error" id="err-dueDate"></p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn" id="submitBtn">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast region -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
/* =====================================================================
   CONFIG
   ---------------------------------------------------------------------
   FormSubmit requires a ONE-TIME ACTIVATION: the first submission to a
   new address triggers a confirmation email to that address, and
   submissions only deliver after the link in that email is clicked.
   Replace YOUR_EMAIL@example.com below (the only place the address lives).
   ===================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* ===== Constants / reference data ===== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINT = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on dependency, vendor or approval",
  "Done": "Completed / closed"
};
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===== State: single source of truth (memory only, no storage APIs) ===== */
const state = { tasks: [], filters: { project: "", assignee: "", priority: "" } };
let idCounter = 0;
/* Transient UI state (which card shows delete-confirm / move menu) */
const ui = { confirmId: null, moveId: null, focus: null };

/* ===== Helpers ===== */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayStr(); // ISO strings compare lexicographically
}

function nextId() {
  idCounter += 1;
  return "UOB-ITPM-" + String(idCounter).padStart(4, "0");
}

function optionsHtml(list, selected) {
  return list.map(v => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`).join("");
}

/* ===== Seed data (8 demo tasks) ===== */
function seedTasks() {
  const mk = (title, description, project, category, assignee, priority, due, status) =>
    ({ id: nextId(), title, description, project, category, assignee, priority, dueDate: offsetDate(due), status });
  return [
    mk("Migrate FX pricing service to AWS", "Lift and re-platform the FX pricing microservice to the approved landing zone.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"),
    mk("Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to teller VDI golden image and validate.", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -2, "In Progress"),
    mk("UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off on UAT results.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"),
    mk("Define data lineage for regulatory reports", "Document source-to-report lineage for quarterly returns.", "Data & Analytics", "Data", "Daniel Lim", "Medium", 30, "Backlog"),
    mk("Renew core banking vendor support contract", "Negotiate and renew L3 support SLA with core vendor.", "Vendor Management", "Vendor", "Grace Ong", "Medium", 14, "Backlog"),
    mk("Core ledger batch window performance tuning", "Reduce end-of-day batch runtime by 20%.", "Core Banking Upgrade", "Application Development", "Hui Min Chua", "High", -5, "Blocked"),
    mk("Complete annual DR failover test evidence pack", "Compile evidence for audit and compliance review.", "Infrastructure & Cloud", "Compliance", "Kenneth Soh", "Low", -10, "Done"),
    mk("Decommission legacy reporting server", "Archive data and power down legacy reporting host.", "Data & Analytics", "Infrastructure", "Priya Nair", "Low", 45, "Backlog")
  ];
}

/* ===== applyFilters(): pure client-side filtering of state.tasks ===== */
function applyFilters() {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return state.tasks.filter(t =>
    (!f.project || t.project === f.project) &&
    (!f.priority || t.priority === f.priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* ===== renderCard(): returns HTML string for one task ===== */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const overdue = isOverdue(task) ? `<span class="overdue">Overdue</span>` : "";
  let extra = "";
  if (ui.confirmId === task.id) {
    extra = `<div class="confirm" role="group" aria-label="Confirm delete">
      <span>Delete?</span>
      <button type="button" class="mini danger" data-action="delete-yes" data-id="${id}">Yes</button>
      <button type="button" class="mini" data-action="delete-no" data-id="${id}">No</button>
    </div>`;
  }
  if (ui.moveId === task.id) {
    extra += `<div class="move-menu" role="group" aria-label="Move ${id} to">` +
      STATUSES.filter(s => s !== task.status).map(s =>
        `<button type="button" class="mini" data-action="move-to" data-id="${id}" data-status="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join("") +
      `</div>`;
  }
  return `<article class="card" draggable="true" data-id="${id}" data-priority="${escapeHtml(task.priority)}">
    <div class="card-top">
      <span class="task-id">${id}</span>
      <button type="button" class="icon-btn" data-action="delete-ask" data-id="${id}" aria-label="Delete task ${id}">×</button>
    </div>
    <h3>${escapeHtml(task.title)}</h3>
    <p class="meta">${escapeHtml(task.project)}</p>
    <p class="meta">Assignee: ${escapeHtml(task.assignee)}</p>
    <p class="meta">Due: ${escapeHtml(formatDate(task.dueDate))}</p>
    <div class="badges">
      <span class="pill" data-p="${escapeHtml(task.priority)}">${escapeHtml(task.priority)}</span>
      <span class="tag">${escapeHtml(task.category)}</span>
      ${overdue}
    </div>
    <div class="card-actions">
      <button type="button" class="mini" data-action="move-toggle" data-id="${id}" aria-expanded="${ui.moveId === task.id}">Move ▸</button>
    </div>
    ${extra}
  </article>`;
}

/* ===== renderSummary(): live header counts ===== */
function renderSummary() {
  const all = state.tasks;
  const items = [`<li><strong>${all.length}</strong>Total</li>`];
  STATUSES.forEach(s => items.push(`<li><strong>${all.filter(t => t.status === s).length}</strong>${escapeHtml(s)}</li>`));
  const od = all.filter(isOverdue).length;
  items.push(`<li class="${od ? "is-overdue" : ""}"><strong>${od}</strong>Overdue</li>`);
  document.getElementById("summary").innerHTML = items.join("");
}

/* ===== renderBoard(): the only place card DOM is built ===== */
function renderBoard() {
  const visible = applyFilters();
  document.getElementById("board").innerHTML = STATUSES.map(status => {
    const col = visible.filter(t => t.status === status);
    return `<section class="column" data-status="${escapeHtml(status)}" aria-label="${escapeHtml(status)} column">
      <div class="column-head">
        <div><h2>${escapeHtml(status)}</h2><p>${escapeHtml(STATUS_HINT[status])}</p></div>
        <span class="count" aria-label="${col.length} tasks">${col.length}</span>
      </div>
      <div class="cards">${col.length ? col.map(renderCard).join("") : `<div class="empty">No tasks</div>`}</div>
    </section>`;
  }).join("");
  renderSummary();
  if (ui.focus) {
    const el = document.querySelector(ui.focus);
    if (el) el.focus();
    ui.focus = null;
  }
}

/* ===== Task operations ===== */
function moveTask(id, status) {
  const task = state.tasks.find(t => t.id === id);
  if (task && STATUSES.includes(status)) task.status = status;
  ui.moveId = null;
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  ui.confirmId = null;
  renderBoard();
}

function addTask(data) {
  const task = {
    id: nextId(), title: data.title, description: data.description, project: data.project,
    category: data.category, assignee: data.assignee, priority: data.priority,
    dueDate: data.dueDate, status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* ===== showToast(): non-blocking message in aria-live region ===== */
function showToast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : "");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ===== notifyNewTask(): FormSubmit AJAX call (email only goes to the endpoint) ===== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===== Form: read, validate, submit ===== */
const form = document.getElementById("taskForm");

function readForm() {
  const v = id => form.elements[id].value;
  return {
    title: v("title").trim(), description: v("description").trim(), project: v("project"),
    category: v("category"), assignee: v("assignee").trim(), priority: v("priority"),
    dueDate: v("dueDate"), status: v("status")
  };
}

function validate(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (data.dueDate < todayStr()) errors.dueDate = "Due date must not be in the past.";
  return errors;
}

function showErrors(errors) {
  ["title", "description", "assignee", "dueDate"].forEach(name => {
    const msg = errors[name] || "";
    document.getElementById("err-" + name).textContent = msg;
    form.querySelector(`[data-field="${name}"]`).classList.toggle("invalid", !!msg);
    form.elements[name].setAttribute("aria-invalid", msg ? "true" : "false");
  });
  const first = Object.keys(errors)[0];
  if (first) form.elements[first].focus();
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  const errors = validate(data);
  showErrors(errors);
  if (Object.keys(errors).length) return;

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  const task = addTask(data); // optimistic: card appears immediately
  closeModal();
  resetForm();
  showToast(`Task ${task.id} added.`);

  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

function resetForm() {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  form.elements.dueDate.min = todayStr();
  showErrors({});
}

/* ===== Modal open/close ===== */
const backdrop = document.getElementById("modalBackdrop");
let lastTrigger = null;
function openModal() {
  lastTrigger = document.activeElement;
  form.elements.dueDate.min = todayStr();
  backdrop.classList.add("open");
  form.elements.title.focus();
}
function closeModal() {
  backdrop.classList.remove("open");
  if (lastTrigger && lastTrigger.focus) lastTrigger.focus();
}

/* ===== Event wiring ===== */
function setupControls() {
  document.getElementById("project").innerHTML = optionsHtml(PROJECTS);
  document.getElementById("category").innerHTML = optionsHtml(CATEGORIES);
  document.getElementById("priority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  document.getElementById("status").innerHTML = optionsHtml(STATUSES, "Backlog");
  document.getElementById("fProject").innerHTML = `<option value="">All projects</option>` + optionsHtml(PROJECTS);
  document.getElementById("fPriority").innerHTML = `<option value="">All priorities</option>` + optionsHtml(PRIORITIES);

  document.getElementById("openAdd").addEventListener("click", openModal);
  document.getElementById("closeAdd").addEventListener("click", closeModal);
  document.getElementById("cancelAdd").addEventListener("click", closeModal);
  backdrop.addEventListener("mousedown", e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && backdrop.classList.contains("open")) closeModal(); });
  form.addEventListener("submit", handleSubmit);

  const fp = document.getElementById("fProject"), fa = document.getElementById("fAssignee"), fr = document.getElementById("fPriority");
  const onFilter = () => { state.filters = { project: fp.value, assignee: fa.value, priority: fr.value }; renderBoard(); };
  [fp, fr].forEach(el => el.addEventListener("change", onFilter));
  fa.addEventListener("input", onFilter);
  document.getElementById("clearFilters").addEventListener("click", () => { fp.value = ""; fa.value = ""; fr.value = ""; onFilter(); });
}

/* Delegated handlers for card buttons + drag and drop (board is re-rendered, so listen on the stable parent) */
function setupBoardEvents() {
  const board = document.getElementById("board");

  board.addEventListener("click", e => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.dataset.id, q = id.replace(/"/g, "");
    switch (btn.dataset.action) {
      case "delete-ask": ui.confirmId = id; ui.moveId = null; ui.focus = `[data-action="delete-no"][data-id="${q}"]`; renderBoard(); break;
      case "delete-no": ui.confirmId = null; ui.focus = `[data-action="delete-ask"][data-id="${q}"]`; renderBoard(); break;
      case "delete-yes": deleteTask(id); break;
      case "move-toggle": ui.moveId = ui.moveId === id ? null : id; ui.confirmId = null; ui.focus = `[data-action="move-toggle"][data-id="${q}"]`; renderBoard(); break;
      case "move-to": ui.focus = `[data-action="move-toggle"][data-id="${q}"]`; moveTask(id, btn.dataset.status); break;
    }
  });

  let draggedId = null;
  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    draggedId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggedId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", () => {
    draggedId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach(el => el.classList.remove("dragging", "drop-target"));
  });
  board.addEventListener("dragover", e => {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach(el => { if (el !== col) el.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", e => {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", e => {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    const id = draggedId;
    draggedId = null;
    moveTask(id, col.dataset.status);
  });
}

/* ===== Init ===== */
state.tasks = seedTasks();
setupControls();
setupBoardEvents();
resetForm();
renderBoard();
</script>
</body>
