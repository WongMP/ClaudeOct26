<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Kanban (Demo)</title>
<style>
/* =====================================================================
   DESIGN TOKENS
   Direction (ui-ux-pro-max design system for "enterprise banking project
   management kanban", density 8 / motion 3 / variance 4):
   Swiss minimal + data-dense dashboard. Navy/trust-blue, gold accent for
   the primary CTA only, IBM Plex Sans when installed (no downloads —
   the file stays dependency-free), light and dark themes.
   ===================================================================== */
:root {
  --navy-950: #020617;
  --navy-900: #0f172a;
  --blue-800: #1e3a8a;
  --blue-600: #2563eb;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-sunken: #f1f5f9;
  --muted: #e8ecf1;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --fg: #020617;
  --fg-muted: #475569;
  --ring: #1e3a8a;

  --header-bg: #0f172a;
  --header-fg: #ffffff;
  --header-muted: #cbd5e1;
  --header-chip: rgba(255, 255, 255, .08);
  --header-chip-border: rgba(255, 255, 255, .14);

  --accent: #a16207;          /* CTA only */
  --accent-hover: #854d0e;
  --on-accent: #ffffff;

  --primary: #1e3a8a;
  --primary-hover: #172e6e;
  --on-primary: #ffffff;
  --primary-soft: #eef2fb;

  /* Priority + status semantics (always paired with text) */
  --critical: #dc2626;  --critical-fg: #b91c1c; --critical-bg: #fef2f2;
  --high: #d97706;      --high-fg: #92400e;     --high-bg: #fffbeb;
  --medium: #2563eb;    --medium-fg: #1e40af;   --medium-bg: #eff6ff;
  --low: #94a3b8;       --low-fg: #475569;      --low-bg: #f1f5f9;
  --success: #15803d;   --success-bg: #f0fdf4;
  --warning: #b45309;   --warning-bg: #fffbeb;

  --st-backlog: #64748b;
  --st-progress: #2563eb;
  --st-blocked: #dc2626;
  --st-done: #15803d;

  /* Dense spacing scale (8–32px) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --radius-sm: 4px; --radius: 6px; --radius-lg: 8px;
  --shadow-card: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 1px rgba(15, 23, 42, .04);
  --shadow-raise: 0 4px 12px rgba(15, 23, 42, .10);
  --shadow-modal: 0 20px 48px rgba(2, 6, 23, .28);

  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;

  --dur-fast: 150ms; --dur: 200ms;
  --ease: cubic-bezier(.2, 0, 0, 1);
  color-scheme: light;
}

/* Dark theme: tokens only, re-checked for 4.5:1 text contrast */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1120;
    --surface: #111a2e;
    --surface-sunken: #0e1628;
    --muted: #1c2740;
    --border: #23314d;
    --border-strong: #33446a;
    --fg: #e5eaf3;
    --fg-muted: #9fb0c8;
    --ring: #93b4ff;

    --header-bg: #060b17;
    --header-chip: rgba(255, 255, 255, .06);

    --accent: #ca8a04; --accent-hover: #a16207; --on-accent: #1a1203;
    --primary: #3b6fe0; --primary-hover: #2f5cc4; --on-primary: #ffffff;
    --primary-soft: #16244a;

    --critical: #f87171; --critical-fg: #fca5a5; --critical-bg: #3a1518;
    --high: #f59e0b;     --high-fg: #fcd34d;     --high-bg: #33250a;
    --medium: #60a5fa;   --medium-fg: #93c5fd;   --medium-bg: #132a4d;
    --low: #7c8aa3;      --low-fg: #c1cbdb;      --low-bg: #1f2a40;
    --success: #4ade80;  --success-bg: #0f2a1a;
    --warning: #fbbf24;  --warning-bg: #33250a;

    --st-backlog: #94a3b8; --st-progress: #60a5fa; --st-blocked: #f87171; --st-done: #4ade80;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-raise: 0 6px 16px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--fg); font-size: var(--fs-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, [draggable="true"] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 14px; height: 14px; }

/* ===== Buttons (≥32px tall, 8px gaps) ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-4); border-radius: var(--radius); border: 1px solid transparent; font-weight: 600; font-size: var(--fs-md); transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-accent:hover:not(:disabled) { background: var(--accent-hover); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-sunken); }
.btn-quiet { background: transparent; color: var(--fg-muted); min-height: 32px; padding: 0 var(--s-3); }
.btn-quiet:hover { background: var(--muted); color: var(--fg); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius); background: transparent; color: var(--fg-muted); transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.icon-btn:hover { background: var(--muted); color: var(--fg); }
.icon-btn.danger:hover { background: var(--critical-bg); color: var(--critical-fg); }

/* ===== Header: wordmark + KPI strip ===== */
.app-header { background: var(--header-bg); color: var(--header-fg); }
.header-inner { max-width: 1600px; margin: 0 auto; padding: var(--s-4) var(--s-5); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-4) var(--s-5); }
.brand { display: flex; align-items: center; gap: var(--s-3); margin-right: auto; }
.brand-mark { width: 32px; height: 32px; border-radius: var(--radius); background: var(--blue-800); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
.wordmark { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
.brand-sub { font-size: var(--fs-xs); color: var(--header-muted); letter-spacing: .06em; text-transform: uppercase; }

.kpis { display: flex; flex-wrap: wrap; gap: var(--s-2); list-style: none; margin: 0; padding: 0; }
.kpi { display: flex; flex-direction: column; min-width: 84px; padding: 6px var(--s-3); border: 1px solid var(--header-chip-border); background: var(--header-chip); border-radius: var(--radius); }
.kpi-label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--header-muted); white-space: nowrap; }
.kpi-value { font-size: var(--fs-lg); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
.kpi.is-alert { border-color: rgba(248, 113, 113, .6); background: rgba(220, 38, 38, .22); }

/* Distribution bar: status mix at a glance (labels carry the numbers) */
.mix { max-width: 1600px; margin: 0 auto; padding: 0 var(--s-5) var(--s-4); }
.mix-bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--header-chip); }
.mix-bar span { display: block; height: 100%; background: var(--seg); transition: flex-grow var(--dur) var(--ease); }

/* ===== Toolbar: filters ===== */
.toolbar { background: var(--surface); border-bottom: 1px solid var(--border); }
.toolbar-inner { max-width: 1600px; margin: 0 auto; padding: var(--s-3) var(--s-5); display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s-3); }
.filter { display: flex; flex-direction: column; gap: var(--s-1); }
.filter label { font-size: var(--fs-xs); font-weight: 600; color: var(--fg-muted); letter-spacing: .04em; text-transform: uppercase; }
.control { min-height: 36px; padding: 0 var(--s-3); border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--fg); min-width: 180px; transition: border-color var(--dur-fast) var(--ease); }
.control:hover { border-color: var(--fg-muted); }
.search { position: relative; }
.search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }
.search .control { padding-left: 32px; }
.toolbar-meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: var(--fs-xs); color: var(--fg-muted); }
.result-count { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.demo-note { display: inline-flex; align-items: center; gap: 6px; }

/* ===== Board ===== */
main { max-width: 1600px; margin: 0 auto; padding: var(--s-4) var(--s-5) var(--s-6); }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-4); align-items: start; }
.column { display: flex; flex-direction: column; background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-lg); min-height: 240px; transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.column.drop-target { background: var(--primary-soft); border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.column-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-2); padding: var(--s-3) var(--s-3) var(--s-2); border-bottom: 1px solid var(--border); }
.column-title:focus { outline: none; }
.column-title:focus-visible { outline: 2px solid var(--ring); }
.column-title { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-md); font-weight: 700; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); flex: none; }
.column-hint { font-size: var(--fs-xs); color: var(--fg-muted); margin-top: 2px; }
.count { min-width: 28px; height: 24px; padding: 0 var(--s-2); border-radius: 999px; background: var(--surface); border: 1px solid var(--border-strong); font-size: var(--fs-xs); font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.cards { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3); min-height: 80px; }
.empty { display: grid; place-items: center; gap: var(--s-1); padding: var(--s-5) var(--s-3); border: 1px dashed var(--border-strong); border-radius: var(--radius); color: var(--fg-muted); font-size: var(--fs-sm); text-align: center; }

/* ===== Cards ===== */
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--prio); border-radius: var(--radius); padding: var(--s-3); box-shadow: var(--shadow-card); transition: box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.card:hover { box-shadow: var(--shadow-raise); }
.card.dragging { opacity: .5; }
.card[data-priority="Critical"] { --prio: var(--critical); }
.card[data-priority="High"]     { --prio: var(--high); }
.card[data-priority="Medium"]   { --prio: var(--medium); }
.card[data-priority="Low"]      { --prio: var(--low); }
.card-top { display: flex; align-items: center; gap: var(--s-2); margin: -4px -4px 2px 0; }
.task-id { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--fg-muted); letter-spacing: .02em; margin-right: auto; }
.card-title { font-size: var(--fs-md); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.card-project { font-size: var(--fs-sm); color: var(--primary); margin-top: 2px; overflow-wrap: anywhere; }
@media (prefers-color-scheme: dark) { .card-project { color: var(--medium-fg); } }
.card-meta { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); margin-top: var(--s-2); font-size: var(--fs-sm); color: var(--fg-muted); }
.card-meta span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.card-meta .is-overdue { color: var(--critical-fg); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-2); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 var(--s-2); border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip-prio[data-p="Critical"] { color: var(--critical-fg); background: var(--critical-bg); border-color: var(--critical); }
.chip-prio[data-p="High"]     { color: var(--high-fg); background: var(--high-bg); border-color: var(--high); }
.chip-prio[data-p="Medium"]   { color: var(--medium-fg); background: var(--medium-bg); border-color: var(--medium); }
.chip-prio[data-p="Low"]      { color: var(--low-fg); background: var(--low-bg); border-color: var(--low); }
.chip-tag { color: var(--fg-muted); background: var(--surface-sunken); border-color: var(--border); font-weight: 500; border-radius: var(--radius-sm); }
.chip-overdue { color: var(--critical-fg); background: var(--critical-bg); border-color: var(--critical); }
.card-actions { display: flex; align-items: center; gap: var(--s-2); margin-top: var(--s-3); padding-top: var(--s-2); border-top: 1px solid var(--border); }
.btn-move { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 var(--s-2); border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-sm); font-weight: 600; color: var(--fg); transition: background-color var(--dur-fast) var(--ease); }
.btn-move:hover, .btn-move[aria-expanded="true"] { background: var(--primary-soft); border-color: var(--primary); }
.panel { margin-top: var(--s-2); padding: var(--s-2); border-radius: var(--radius); background: var(--surface-sunken); border: 1px solid var(--border); }
.panel-label { font-size: var(--fs-xs); font-weight: 600; color: var(--fg-muted); margin-bottom: 6px; }
.panel-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.mini { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 var(--s-3); border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); font-size: var(--fs-sm); font-weight: 600; transition: background-color var(--dur-fast) var(--ease); }
.mini:hover { background: var(--muted); }
.mini .status-dot { width: 8px; height: 8px; }
.panel.confirm { background: var(--critical-bg); border-color: var(--critical); }
.panel.confirm .panel-label { color: var(--critical-fg); }
.mini.danger { background: var(--critical); border-color: var(--critical); color: #fff; }
.mini.danger:hover { filter: brightness(.92); }

/* ===== Modal (native <dialog>: focus contained, Esc closes) ===== */
dialog.modal { width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); color: var(--fg); box-shadow: var(--shadow-modal); }
dialog.modal::backdrop { background: rgba(2, 6, 23, .55); }
dialog.modal[open] { animation: modal-in var(--dur) var(--ease); }
@keyframes modal-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: var(--fs-lg); font-weight: 700; }
.modal-body { padding: var(--s-4) var(--s-5); }
.modal-foot { display: flex; justify-content: flex-end; gap: var(--s-2); padding: var(--s-3) var(--s-5); border-top: 1px solid var(--border); background: var(--surface-sunken); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--s-4); }
.field-label { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-sm); font-weight: 600; }
.req { color: var(--critical-fg); }
.counter { font-weight: 400; font-size: var(--fs-xs); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.hint { font-size: var(--fs-xs); color: var(--fg-muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 38px; padding: var(--s-2) var(--s-3); border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); transition: border-color var(--dur-fast) var(--ease); }
.field textarea { min-height: 84px; resize: vertical; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--critical); background: var(--critical-bg); }
.error { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--critical-fg); font-weight: 600; }
.error:empty { display: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s-3); }

/* ===== Toasts ===== */
.toasts { position: fixed; right: var(--s-4); bottom: var(--s-4); z-index: 50; display: flex; flex-direction: column; gap: var(--s-2); width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; align-items: flex-start; gap: var(--s-2); padding: var(--s-3); border-radius: var(--radius); border: 1px solid var(--border); border-left: 4px solid var(--success); background: var(--surface); color: var(--fg); box-shadow: var(--shadow-raise); font-size: var(--fs-sm); animation: toast-in var(--dur) var(--ease); }
.toast .icon { color: var(--success); margin-top: 1px; }
.toast.warn { border-left-color: var(--warning); background: var(--warning-bg); }
.toast.warn .icon { color: var(--warning); }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===== Responsive ===== */
@media (max-width: 1099px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 767px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .header-inner, .toolbar-inner, main, .mix { padding-left: var(--s-4); padding-right: var(--s-4); }
  .brand { margin-right: 0; width: 100%; }
  .header-inner > .btn { width: 100%; }
  .kpi { min-width: 0; flex: 1 1 calc(33% - var(--s-2)); }
  .filter, .control { width: 100%; min-width: 0; }
  .toolbar-meta { margin-left: 0; align-items: flex-start; }
  .grid-2 { grid-template-columns: 1fr; }
}

/* Reduced motion: zero the duration tokens and drop entrance animations */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur: 0ms; }
  dialog.modal[open], .toast { animation: none; }
}
</style>
</head>

<!-- Inline SVG icon sprite (Lucide-style 1.75px strokes; decorative, hidden from AT) -->

  <symbol id="i-move" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></symbol>
  <!-- Priority shapes: a second, non-colour signal next to the text label -->
  <symbol id="p-Critical" viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/></symbol>

<!-- Toasts (visual + polite announcements) and a single status region for board changes -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="visually-hidden" id="announcer" role="status" aria-atomic="true"></div>

<script>
/* =====================================================================
   CONFIG
   ---------------------------------------------------------------------
   FormSubmit requires a ONE-TIME ACTIVATION: the first submission to a
   new address triggers a confirmation email to that address, and
   submissions only deliver after the link in that email is clicked.
   Replace YOUR_EMAIL@example.com below (the only place the address lives).
   ===================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* ===== Constants / reference data ===== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINT = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on dependency, vendor or approval",
  "Done": "Completed / closed"
};
const STATUS_COLOR = { "Backlog": "var(--st-backlog)", "In Progress": "var(--st-progress)", "Blocked": "var(--st-blocked)", "Done": "var(--st-done)" };
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PRIORITY_RANK = { Critical: 0, High: 1, Medium: 2, Low: 3 };

/* ===== State: single source of truth (memory only, no storage APIs) ===== */
const state = { tasks: [], filters: { project: "", assignee: "", priority: "" } };
let idCounter = 0;
/* Transient UI state (which card shows delete-confirm / move menu) */
const ui = { confirmId: null, moveId: null, focus: null };

/* ===== Helpers ===== */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function icon(name, cls) {
  return `<svg class="icon${cls ? " " + cls : ""}" aria-hidden="true"><use href="#${name}"/></svg>`;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayStr(); // ISO strings compare lexicographically
}

function nextId() {
  idCounter += 1;
  return "UOB-ITPM-" + String(idCounter).padStart(4, "0");
}

function optionsHtml(list, selected) {
  return list.map(v => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`).join("");
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

/* Board changes are announced once, with context, from one status region */
function announce(message) {
  const el = document.getElementById("announcer");
  el.textContent = "";
  requestAnimationFrame(() => { el.textContent = message; });
}

/* ===== Seed data (8 demo tasks) ===== */
function seedTasks() {
  const mk = (title, description, project, category, assignee, priority, due, status) =>
    ({ id: nextId(), title, description, project, category, assignee, priority, dueDate: offsetDate(due), status });
  return [
    mk("Migrate FX pricing service to AWS", "Lift and re-platform the FX pricing microservice to the approved landing zone.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"),
    mk("Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to teller VDI golden image and validate.", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -2, "In Progress"),
    mk("UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off on UAT results.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"),
    mk("Define data lineage for regulatory reports", "Document source-to-report lineage for quarterly returns.", "Data & Analytics", "Data", "Daniel Lim", "Medium", 30, "Backlog"),
    mk("Renew core banking vendor support contract", "Negotiate and renew L3 support SLA with core vendor.", "Vendor Management", "Vendor", "Grace Ong", "Medium", 14, "Backlog"),
    mk("Core ledger batch window performance tuning", "Reduce end-of-day batch runtime by 20%.", "Core Banking Upgrade", "Application Development", "Hui Min Chua", "High", -5, "Blocked"),
    mk("Complete annual DR failover test evidence pack", "Compile evidence for audit and compliance review.", "Infrastructure & Cloud", "Compliance", "Kenneth Soh", "Low", -10, "Done"),
    mk("Decommission legacy reporting server", "Archive data and power down legacy reporting host.", "Data & Analytics", "Infrastructure", "Priya Nair", "Low", 45, "Backlog")
  ];
}

/* ===== applyFilters(): pure client-side filtering of state.tasks ===== */
function applyFilters() {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return state.tasks.filter(t =>
    (!f.project || t.project === f.project) &&
    (!f.priority || t.priority === f.priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* ===== renderCard(): returns HTML string for one task ===== */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = escapeHtml(task.priority);
  const overdue = isOverdue(task);
  let panel = "";
  if (ui.confirmId === task.id) {
    panel = `<div class="panel confirm" role="group" aria-label="Confirm delete ${id}">
      <p class="panel-label">Delete this task?</p>
      <div class="panel-actions">
        <button type="button" class="mini danger" data-action="delete-yes" data-id="${id}">Yes, delete</button>
        <button type="button" class="mini" data-action="delete-no" data-id="${id}">No</button>
      </div>
    </div>`;
  } else if (ui.moveId === task.id) {
    panel = `<div class="panel" role="group" aria-label="Move ${id} to">
      <p class="panel-label">Move to</p>
      <div class="panel-actions">` +
      STATUSES.filter(s => s !== task.status).map(s =>
        `<button type="button" class="mini" data-action="move-to" data-id="${id}" data-status="${escapeHtml(s)}"><span class="status-dot" style="--dot:${STATUS_COLOR[s]}" aria-hidden="true"></span>${escapeHtml(s)}</button>`).join("") +
      `</div></div>`;
  }
  return `<article class="card" draggable="true" data-id="${id}" data-priority="${prio}" aria-labelledby="t-${id}">
    <div class="card-top">
      <span class="task-id">${id}</span>
      <button type="button" class="icon-btn danger" data-action="delete-ask" data-id="${id}" aria-label="Delete task ${id}">${icon("i-trash")}</button>
    </div>
    <h3 class="card-title" id="t-${id}">${escapeHtml(task.title)}</h3>
    <p class="card-project">${escapeHtml(task.project)}</p>
    <div class="card-meta">
      <span>${icon("i-user", "icon-sm")}<span class="visually-hidden">Assignee: </span>${escapeHtml(task.assignee)}</span>
      <span class="${overdue ? "is-overdue" : ""}">${icon("i-calendar", "icon-sm")}<span class="visually-hidden">Due: </span><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></span>
    </div>
    <div class="chips">
      <span class="chip chip-prio" data-p="${prio}">${icon("p-" + task.priority, "icon-sm")}${prio}</span>
      <span class="chip chip-tag">${escapeHtml(task.category)}</span>
      ${overdue ? `<span class="chip chip-overdue">${icon("i-alert", "icon-sm")}Overdue</span>` : ""}
    </div>
    <div class="card-actions">
      <button type="button" class="btn-move" data-action="move-toggle" data-id="${id}" aria-expanded="${ui.moveId === task.id}">${icon("i-move", "icon-sm")}Move</button>
    </div>
    ${panel}
  </article>`;
}

/* ===== renderSummary(): live header KPIs + status mix bar ===== */
function renderSummary() {
  const all = state.tasks;
  const counts = STATUSES.map(s => all.filter(t => t.status === s).length);
  const od = all.filter(isOverdue).length;
  const kpi = (label, value, extra) =>
    `<li class="kpi${extra && extra.alert ? " is-alert" : ""}">
      <span class="kpi-label">${extra && extra.dot ? `<span class="dot" style="--dot:${extra.dot}" aria-hidden="true"></span>` : ""}${extra && extra.icon ? icon(extra.icon, "icon-sm") : ""}${label}</span>
      <span class="kpi-value">${value}</span>
    </li>`;
  document.getElementById("summary").innerHTML =
    kpi("Total", all.length) +
    STATUSES.map((s, i) => kpi(escapeHtml(s), counts[i], { dot: STATUS_COLOR[s] })).join("") +
    kpi("Overdue", od, { alert: od > 0, icon: "i-alert" });
  document.getElementById("mixBar").innerHTML = STATUSES.map((s, i) =>
    counts[i] ? `<span style="flex-grow:${counts[i]};--seg:${STATUS_COLOR[s]}"></span>` : "").join("");
}

/* ===== renderBoard(): the only place card DOM is built ===== */
function renderBoard() {
  const visible = applyFilters();
  const filtering = !!(state.filters.project || state.filters.priority || state.filters.assignee.trim());
  document.getElementById("board").innerHTML = STATUSES.map(status => {
    const col = visible.filter(t => t.status === status)
      .sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || a.dueDate.localeCompare(b.dueDate));
    const slug = status.toLowerCase().replace(/\s+/g, "-");
    return `<section class="column" data-status="${escapeHtml(status)}" aria-labelledby="col-${slug}">
      <div class="column-head">
        <div>
          <h2 class="column-title" id="col-${slug}" tabindex="-1"><span class="status-dot" style="--dot:${STATUS_COLOR[status]}" aria-hidden="true"></span>${escapeHtml(status)}</h2>
          <p class="column-hint">${escapeHtml(STATUS_HINT[status])}</p>
        </div>
        <span class="count" aria-label="${plural(col.length, "task")}">${col.length}</span>
      </div>
      <div class="cards">${col.length ? col.map(renderCard).join("") :
        `<div class="empty">${icon("i-inbox")}<span>${filtering ? "No matching tasks" : "No tasks — drag a card here"}</span></div>`}</div>
    </section>`;
  }).join("");
  document.getElementById("resultCount").textContent = filtering
    ? `Showing ${visible.length} of ${plural(state.tasks.length, "task")}`
    : plural(state.tasks.length, "task");
  renderSummary();
  if (ui.focus) {
    const el = document.querySelector(ui.focus);
    if (el) el.focus();
    ui.focus = null;
  }
}

/* ===== Task operations ===== */
function moveTask(id, status) {
  const task = state.tasks.find(t => t.id === id);
  ui.moveId = null;
  if (task && STATUSES.includes(status) && task.status !== status) {
    task.status = status;
    renderBoard();
    const n = state.tasks.filter(t => t.status === status).length;
    announce(`${task.id} moved to ${status}. ${status} now has ${plural(n, "task")}.`);
  } else {
    renderBoard();
  }
}

function deleteTask(id) {
  const task = state.tasks.find(t => t.id === id);
  state.tasks = state.tasks.filter(t => t.id !== id);
  ui.confirmId = null;
  if (task) ui.focus = `#col-${task.status.toLowerCase().replace(/\s+/g, "-")}`;
  renderBoard();
  if (task) announce(`${task.id} deleted. ${plural(state.tasks.length, "task")} remain.`);
}

function addTask(data) {
  const task = {
    id: nextId(), title: data.title, description: data.description, project: data.project,
    category: data.category, assignee: data.assignee, priority: data.priority,
    dueDate: data.dueDate, status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* ===== showToast(): non-blocking message in aria-live region ===== */
function showToast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : "");
  el.innerHTML = icon(kind === "warn" ? "i-alert" : "i-check") + `<span>${escapeHtml(message)}</span>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "warn" ? 7000 : 4500);
}

/* ===== notifyNewTask(): FormSubmit AJAX call (email only goes to the endpoint) ===== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===== Form: read, validate, submit ===== */
const form = document.getElementById("taskForm");
const dialog = document.getElementById("addDialog");

function readForm() {
  const v = id => form.elements[id].value;
  return {
    title: v("title").trim(), description: v("description").trim(), project: v("project"),
    category: v("category"), assignee: v("assignee").trim(), priority: v("priority"),
    dueDate: v("dueDate"), status: v("status")
  };
}

function validate(data) {
  const errors = {};
  if (!data.title) errors.title = "Enter a task title.";
  else if (data.title.length > 80) errors.title = "Keep the title to 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Keep the description to 500 characters or fewer.";
  if (!data.assignee) errors.assignee = "Enter who the task is assigned to.";
  if (!data.dueDate) errors.dueDate = "Choose a due date.";
  else if (data.dueDate < todayStr()) errors.dueDate = "Choose today or a later date.";
  return errors;
}

function showErrors(errors) {
  ["title", "description", "assignee", "dueDate"].forEach(name => {
    const msg = errors[name] || "";
    document.getElementById("err-" + name).innerHTML = msg ? icon("i-alert", "icon-sm") + escapeHtml(msg) : "";
    form.querySelector(`[data-field="${name}"]`).classList.toggle("invalid", !!msg);
    form.elements[name].setAttribute("aria-invalid", msg ? "true" : "false");
  });
  const first = Object.keys(errors)[0];
  if (first) form.elements[first].focus();
}

function updateCounters() {
  document.getElementById("cnt-title").textContent = `${form.elements.title.value.length}/80`;
  document.getElementById("cnt-description").textContent = `${form.elements.description.value.length}/500`;
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  const errors = validate(data);
  showErrors(errors);
  if (Object.keys(errors).length) return;

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  const task = addTask(data); // optimistic: card appears immediately
  closeModal();
  resetForm();
  showToast(`Task ${task.id} added to ${task.status}.`);

  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

function resetForm() {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  form.elements.dueDate.min = todayStr();
  updateCounters();
  showErrors({});
}

/* ===== Modal open/close (native dialog keeps focus inside; Esc closes) ===== */
let lastTrigger = null;
function openModal() {
  lastTrigger = document.activeElement;
  form.elements.dueDate.min = todayStr();
  dialog.showModal();
  form.elements.title.focus();
}
function closeModal() {
  if (dialog.open) dialog.close();
}

/* ===== Event wiring ===== */
function setupControls() {
  document.getElementById("project").innerHTML = optionsHtml(PROJECTS);
  document.getElementById("category").innerHTML = optionsHtml(CATEGORIES);
  document.getElementById("priority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  document.getElementById("status").innerHTML = optionsHtml(STATUSES, "Backlog");
  document.getElementById("fProject").innerHTML = `<option value="">All projects</option>` + optionsHtml(PROJECTS);
  document.getElementById("fPriority").innerHTML = `<option value="">All priorities</option>` + optionsHtml(PRIORITIES);

  document.getElementById("openAdd").addEventListener("click", openModal);
  document.getElementById("closeAdd").addEventListener("click", closeModal);
  document.getElementById("cancelAdd").addEventListener("click", closeModal);
  dialog.addEventListener("close", () => { if (lastTrigger && lastTrigger.focus) lastTrigger.focus(); });
  dialog.addEventListener("mousedown", e => { if (e.target === dialog) closeModal(); }); // click on backdrop
  form.addEventListener("submit", handleSubmit);
  form.addEventListener("input", e => {
    updateCounters();
    const field = e.target.closest("[data-field]");
    if (field && field.classList.contains("invalid")) {
      field.classList.remove("invalid");
      e.target.setAttribute("aria-invalid", "false");
      const err = document.getElementById("err-" + e.target.name);
      if (err) err.innerHTML = "";
    }
  });

  const fp = document.getElementById("fProject"), fa = document.getElementById("fAssignee"), fr = document.getElementById("fPriority");
  const onFilter = () => { state.filters = { project: fp.value, assignee: fa.value, priority: fr.value }; renderBoard(); };
  [fp, fr].forEach(el => el.addEventListener("change", onFilter));
  fa.addEventListener("input", onFilter);
  document.getElementById("clearFilters").addEventListener("click", () => { fp.value = ""; fa.value = ""; fr.value = ""; onFilter(); });
}

/* Delegated handlers for card buttons + drag and drop (board is re-rendered, so listen on the stable parent) */
function setupBoardEvents() {
  const board = document.getElementById("board");

  board.addEventListener("click", e => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.dataset.id, q = id.replace(/"/g, "");
    switch (btn.dataset.action) {
      case "delete-ask": ui.confirmId = id; ui.moveId = null; ui.focus = `[data-action="delete-no"][data-id="${q}"]`; renderBoard(); break;
      case "delete-no": ui.confirmId = null; ui.focus = `[data-action="delete-ask"][data-id="${q}"]`; renderBoard(); break;
      case "delete-yes": deleteTask(id); break;
      case "move-toggle":
        ui.moveId = ui.moveId === id ? null : id; ui.confirmId = null;
        ui.focus = ui.moveId ? `[data-action="move-to"][data-id="${q}"]` : `[data-action="move-toggle"][data-id="${q}"]`;
        renderBoard(); break;
      case "move-to": ui.focus = `[data-action="move-toggle"][data-id="${q}"]`; moveTask(id, btn.dataset.status); break;
    }
  });

  board.addEventListener("keydown", e => {
    if (e.key !== "Escape" || !(ui.moveId || ui.confirmId)) return;
    const id = (ui.moveId || ui.confirmId).replace(/"/g, "");
    ui.focus = `[data-action="${ui.moveId ? "move-toggle" : "delete-ask"}"][data-id="${id}"]`;
    ui.moveId = null; ui.confirmId = null;
    renderBoard();
  });

  let draggedId = null;
  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    draggedId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggedId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", () => {
    draggedId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach(el => el.classList.remove("dragging", "drop-target"));
  });
  board.addEventListener("dragover", e => {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach(el => { if (el !== col) el.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", e => {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", e => {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    const id = draggedId;
    draggedId = null;
    moveTask(id, col.dataset.status);
  });
}

/* ===== Init ===== */
state.tasks = seedTasks();
setupControls();
setupBoardEvents();
resetForm();
renderBoard();
</script>
</body>
</html>
